<style>
/* Layout: navy suiting sidebar (the "shop rail") + cool pressed-cotton work surface; cognac leather accent. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eceef3; --line:#dadde5; --fg:#1b2130; --muted:#5f6779;
  --rail:#141b2d; --rail-fg:#c9cedb; --rail-active:#232c45;
  --accent:#9c5a24; --accent-soft:#f4e7da; --accent-fg:#ffffff;
  --good:#1f7a4f; --good-soft:#e0f2e8; --warn:#a86a00; --warn-soft:#fbefd6; --bad:#b4332b; --bad-soft:#f9e1df; --info:#2f5aa8; --info-soft:#e2eaf8;
  --f-display:"Bodoni Moda", "Didot", Georgia, serif; --f-body:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:8px; --shadow:0 1px 2px rgba(20,27,45,.06), 0 4px 16px rgba(20,27,45,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f131c; --surface:#171c28; --surface-2:#1f2533; --line:#2c3344; --fg:#e7e9ef; --muted:#9aa2b5;
  --rail:#0a0d15; --rail-fg:#aeb5c6; --rail-active:#1c2337;
  --accent:#d9925a; --accent-soft:#3a2a1d; --accent-fg:#1a1208;
  --good:#5cc08e; --good-soft:#173527; --warn:#e3a842; --warn-soft:#3a2d12; --bad:#ec7a70; --bad-soft:#3d1c1a; --info:#86a9ec; --info-soft:#1c2a45;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f131c; --surface:#171c28; --surface-2:#1f2533; --line:#2c3344; --fg:#e7e9ef; --muted:#9aa2b5;
  --rail:#0a0d15; --rail-fg:#aeb5c6; --rail-active:#1c2337;
  --accent:#d9925a; --accent-soft:#3a2a1d; --accent-fg:#1a1208;
  --good:#5cc08e; --good-soft:#173527; --warn:#e3a842; --warn-soft:#3a2d12; --bad:#ec7a70; --bad-soft:#3d1c1a; --info:#86a9ec; --info-soft:#1c2a45;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.02em}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-fg);padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.rail .logo{padding:4px 10px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
.rail .logo .brand{font-size:24px;color:#fff;line-height:1}
.rail .logo .tag{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#d9a774;margin-top:6px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7c869e;padding:10px 10px 4px}
.rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--rail-fg);text-decoration:none;font-weight:500}
.rail a:hover{background:rgba(255,255,255,.05);color:#fff}
.rail a.on{background:var(--rail-active);color:#fff;box-shadow:inset 3px 0 0 #d9a774}
.rail a svg{width:17px;height:17px;flex:none;opacity:.85}
.rail .badge{margin-left:auto;background:#d9a774;color:#1a1208;border-radius:10px;font-size:11px;padding:0 7px;font-weight:600}
.rail .who{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding:12px 10px 0;font-size:12.5px}
.rail .who b{color:#fff;display:block;font-size:13.5px}
.rail .who button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.18);color:var(--rail-fg);border-radius:6px;padding:5px 10px;cursor:pointer}
.main{min-width:0;padding-block:20px 60px;padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px))}
.topbar{display:none}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between;margin-bottom:16px}
.pagehead .sub{color:var(--muted);margin-top:3px}
.syncnote{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.dot.off{background:var(--warn)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card > h2 + *, .card > .cardhead + *{margin-top:12px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-pos{grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.kpi .label{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.kpi .value{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:2px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{padding:12px 18px;font-size:15px}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=tel],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
label.f > span{color:var(--muted)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.form .wide{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line);font-weight:500}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--fg);color:var(--bg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}

/* tables */
.tw{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:3px}
.spark{width:100%;height:auto;display:block}
.spark text{fill:var(--muted);font-size:12px;font-family:var(--f-body)}

/* POS */
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:520px;overflow:auto;padding:2px}
.prod{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px}
.prod:hover{border-color:var(--accent)}
.prod .n{font-weight:600;line-height:1.25}
.prod .v{font-size:12px;color:var(--muted)}
.prod .p{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-variant-numeric:tabular-nums}
.prod[disabled]{opacity:.45;cursor:not-allowed}
.cart td{padding:6px 4px}
.cart input{padding:4px 6px;width:56px}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums;font-size:13.5px}
.totals .grand{font-size:22px;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{display:flex;justify-content:space-between}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.lead:hover{border-color:var(--accent)}

/* modal / drawer */
.overlay{position:fixed;inset:0;background:rgba(10,13,21,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:5vh max(16px, env(safe-area-inset-right,0px)) 16px max(16px, env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--surface);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(720px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(980px,100%)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:80;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* receipt */
.receipt{font-family:var(--f-mono);font-size:12.5px;background:#fff;color:#111;border:1px dashed #aaa;padding:16px;max-width:380px;margin:0 auto;width:100%}
.receipt .c{text-align:center}
.receipt table{font-size:12px}
.receipt td,.receipt th{padding:3px 2px;border:0;color:#111}
.receipt hr{border:0;border-top:1px dashed #999}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.login .hero{background:var(--rail);color:#cfd4e0;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;position:relative;overflow:hidden}
.login .hero .brand{font-size:56px;color:#fff;line-height:.95}
.login .hero .tag{letter-spacing:.24em;text-transform:uppercase;font-size:12px;color:#d9a774;margin-top:14px}
.login .hero ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:44ch}
.login .hero .pin{position:absolute;right:-60px;bottom:-60px;width:280px;height:280px;border:2px dashed rgba(217,167,116,.25);border-radius:50%}
.login .panel{padding-block:48px;padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:560px;width:100%;margin:0 auto}
.userpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.userpick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.userpick button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.userpick b{font-size:14px}

/* chat widget */
.chatfab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--accent);color:var(--accent-fg);border:0;border-radius:28px;padding:12px 18px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);cursor:pointer;display:flex;gap:8px;align-items:center}
.chatbox{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;width:min(380px,calc(100vw - 32px));height:min(600px,calc(100vh - 40px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.chatbox .ch{background:var(--rail);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.chatbox .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 11px;border-radius:10px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:3px}
.msg.assistant{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:3px}
.msg .ai{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.msg.sys{align-self:center;font-size:12px;color:var(--muted);background:none}
.chatbox form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.wa{background:#e7ddd3;border-radius:8px;padding:14px}
:root[data-theme="dark"] .wa{background:#2a2420}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .wa{background:#2a2420} }
.wa .bubble{background:var(--surface);border-radius:8px 8px 8px 2px;padding:10px 12px;max-width:340px;white-space:pre-wrap;box-shadow:var(--shadow)}
.notice{border:1px solid var(--line);border-left:3px solid var(--info);background:var(--info-soft);border-radius:6px;padding:10px 12px;font-size:13px}
.notice.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.progress{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress > div{height:100%;background:var(--accent);transition:width .2s}

@media (max-width: 1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g-pos{grid-template-columns:minmax(0,1fr)} }
@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--rail);color:#fff;padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
  .topbar .brand{font-size:20px}
  .topbar button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:6px 10px}
  .main{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .login{grid-template-columns:minmax(0,1fr)}
  .login .hero{padding:28px max(16px, env(safe-area-inset-left,0px))}
  .login .hero .brand{font-size:40px}
  .bar{grid-template-columns:80px minmax(0,1fr) 84px}
}
@media (max-width: 480px){ .g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .kpi .value{font-size:20px} .userpick{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

function lineCalc(l){

}

}

const queues = new Map();
function enqueue(key, fn){
  const prev = queues.get(key) || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);

async function withRetry(fn){
  for (let i = 0; i < 6; i++){
    try { return await fn(); }
    catch (e){
      if (e && (e.code === 'resource_exhausted' || e.code === 'unavailable') && i < 5){ await new Promise(r => setTimeout(r, 800 * (i + 1) + Math.random() * 400)); continue; }
      throw e;
    }
  }
}

  const body = Object.assign({}, rec); delete body.id;
  return enqueue(c + '/' + id, () => withRetry(() => db.collection(c).doc(id).set(body))).then(() => rec).catch(e => { writeFailed(e); throw e; });
}

/* ---------- shell ---------- */

  if (!allowedView(U.view)) U.view = 'dashboard';
  const pendingT = all('transfers').filter(t => canSee({branch: t.from}) || canSee({branch: t.to})).filter(t => (isAdmin() && (t.status === 'Requested' || (t.status === 'Partially Received' && !t.resolved))) || (!isAdmin() && ((t.status === 'Approved' && t.from === S.me.branch) || (t.status === 'Dispatched' && t.to === S.me.branch)))).length;
  const newLeads = all('leads').filter(l => (isAdmin() || l.branch === S.me.branch) && l.stage === 'New').length;
  const badges = {transfers: pendingT, leads: newLeads};
  const nav = NAV.map(([g, items]) => {

/* ---------- dashboard ---------- */
VIEWS.dashboard = function(){
  if (S.empty && !all('products').length){
    return pageHead('Dashboard', esc(isAdmin() ? 'Head office overview' : bname(S.me.branch))) + emptyStore();
  }
  const invs = all('invoices').filter(i => inScope(i) && inRange(i.date));
  const live = invs.filter(i => i.status !== 'cancelled');
  const net = live.reduce((a, i) => a + netOf(i), 0);
  const rets = live.reduce((a, i) => a + returnedAmt(i), 0);
  const retCount = live.reduce((a, i) => a + (i.returns || []).length, 0);
  const cost = live.reduce((a, i) => a + i.items.reduce((s, x) => s + x.cost * (x.qty - (x.returnedQty || 0)), 0), 0);
  const taxable = live.reduce((a, i) => a + i.items.reduce((s, x) => s + x.taxable * (x.qty - (x.returnedQty || 0)) / x.qty, 0), 0);
  const margin = taxable - cost;
  const low = lowStock();
  const due = all('leads').filter(l => canSee(l) && l.followUp && l.followUp <= todayKey() && !['Converted','Lost'].includes(l.stage)).length;
  // daily series
  const [a, b] = rangeBounds();
  const days = Math.min(Math.round((b - a) / DAY), 400);
  const byMonth = days > 62;
  const series = new Map();
  if (byMonth){ for (let t = a; t < b; t += DAY){ const k = dayKey(t).slice(0,7); series.set(k, 0); } }
  else for (let t = a; t < b; t += DAY) series.set(dayKey(t), 0);
  live.forEach(i => { const k = byMonth ? dayKey(new Date(i.date).getTime()).slice(0,7) : dayKey(new Date(i.date).getTime()); if (series.has(k)) series.set(k, series.get(k) + netOf(i)); });
  const modeT = {}; live.forEach(i => i.payments.forEach(p => modeT[p.mode] = (modeT[p.mode] || 0) + p.amount));
  const top = {}; live.forEach(i => i.items.forEach(x => { const q = x.qty - (x.returnedQty || 0); if (!top[x.productId]) top[x.productId] = {q:0, v:0}; top[x.productId].q += q; top[x.productId].v += x.total * q / x.qty; }));
  const topRows = Object.entries(top).sort((x, y) => y[1].v - x[1].v).slice(0, 6);
  const brT = BR.map(br => [br, all('invoices').filter(i => i.branch === br && inRange(i.date)).reduce((s, i) => s + netOf(i), 0)]);
  const maxBr = Math.max(1, ...brT.map(x => x[1]));
  const maxMode = Math.max(1, ...Object.values(modeT));
  const recent = all('audit').filter(x => isAdmin() || x.branch === S.me.branch).sort((x, y) => y.date.localeCompare(x.date)).slice(0, 7);
  return pageHead(isAdmin() ? 'Head office dashboard' : bname(S.me.branch) + ' dashboard', `${RANGE_LABEL[U.range]} · ${esc(bname(activeBranch()))}`, branchCtl() + rangeCtl()) + `
  <div class="grid g4">
    ${kpi('Net sales', inr(net), `${live.length} bills · after returns`)}
    ${kpi('Average bill', inr(live.length ? net / live.length : 0), 'Net sales ÷ bills')}
    ${isAdmin() ? kpi('Gross margin', inr(margin), taxable ? Math.round(margin / taxable * 100) + '% of taxable value' : '—') : kpi('Returns', inr(rets), retCount + ' credit notes')}
    ${kpi('Low-stock items', String(low.length), due ? `${due} lead follow-ups due` : 'At or below minimum level', low.length ? 'warn' : '')}
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="cardhead"><h2>Sales trend</h2><span class="muted small">${byMonth ? 'By month' : 'By day'}</span></div>${barChart([...series.entries()], byMonth)}</div>
    <div class="card">${isAdmin() && U.branch === 'ALL' ? `<div class="cardhead"><h2>Branch-wise sales</h2></div><div class="bars">${brT.map(([br, v]) => `<div class="bar"><span>${esc(bname(br))}</span><div class="track"><div class="fill" style="width:${v / maxBr * 100}%"></div></div><span class="num">${inr(v)}</span></div>`).join('')}</div><div style="height:16px"></div>` : ''}
      <div class="cardhead"><h2>Payment modes</h2></div>
      ${Object.keys(modeT).length ? `<div class="bars">${MODES.filter(m => modeT[m]).map(m => `<div class="bar"><span>${m}</span><div class="track"><div class="fill" style="width:${modeT[m] / maxMode * 100}%;background:var(--info)"></div></div><span class="num">${inr(modeT[m])}</span></div>`).join('')}</div>` : '<div class="empty">No payments in this period.</div>'}
    </div>
  </div>
  <div class="grid g3" style="margin-top:14px">
    <div class="card"><div class="cardhead"><h2>Top-selling products</h2></div>${table([{label:'Product', html: r => `${esc(pname(r[0]))}`}, {label:'Qty', num:true, html: r => r[1].q}, {label:'Value', num:true, html: r => inr(r[1].v)}], topRows)}</div>
    <div class="card"><div class="cardhead"><h2>Low-stock alerts</h2><a class="btn sm" href="#inventory" data-act="nav" data-v="inventory">Open stock</a></div>${table([{label:'Product', html: r => esc(pname(r.productId))}, {label:'Branch', html: r => esc(S.settings.branches[r.branch]?.prefix || r.branch)}, {label:'Qty', num:true, html: r => `<b style="color:${r.qty === 0 ? 'var(--bad)' : 'var(--warn)'}">${r.qty}</b> / ${r.min}`}], low.slice(0, 8), {empty:'All items are above their minimum level.'})}</div>
    <div class="card"><div class="cardhead"><h2>Recent activity</h2></div>${recent.length ? `<div class="stack" style="gap:8px">${recent.map(r => `<div><div><b>${esc(r.action)}</b> <span class="muted small">${esc(r.detail)}</span></div><div class="muted small">${fmtDT(r.date)} · ${esc(r.user)}</div></div>`).join('')}</div>` : '<div class="empty">No activity yet.</div>'}</div>
  </div>`;
};
function kpi(label, value, foot, tone = ''){
  return `<div class="card kpi"><div class="label">${label}</div><div class="value" style="${tone === 'warn' && value !== '0' ? 'color:var(--warn)' : ''}">${value}</div><div class="foot">${foot}</div></div>`;
}
function barChart(entries, byMonth){
  if (!entries.length) return '<div class="empty">No data.</div>';
  const W = 600, H = 150, pl = 44, pb = 20, pt = 8;
  const max = Math.max(1, ...entries.map(e => e[1]));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const m = max / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; })();
  const bw = (W - pl) / entries.length;
  const y = v => H - pb - (v / nice) * (H - pb - pt);
  const ticks = [0, nice / 2, nice];
  const lblEvery = Math.ceil(entries.length / 8);
  const short = v => v >= 100000 ? (v / 100000).toFixed(v % 100000 ? 1 : 0) + 'L' : v >= 1000 ? Math.round(v / 1000) + 'k' : String(Math.round(v));
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales trend chart">
    ${ticks.map(t => `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(t) + 3}" text-anchor="end">₹${short(t)}</text>`).join('')}
    ${entries.map(([k, v], i) => `<rect x="${pl + i * bw + bw * .15}" y="${y(v)}" width="${Math.max(1, bw * .7)}" height="${H - pb - y(v)}" fill="var(--accent)" rx="1.5"><title>${k}: ${inr(v)}</title></rect>${i % lblEvery === 0 ? `<text x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${byMonth ? new Date(k + '-01').toLocaleDateString('en-IN', {month:'short'}) : k.slice(8)}</text>` : ''}`).join('')}
  </svg>`;
}
function lowStock(){
  return all('stock').filter(s => inScope(s) && prod(s.productId)?.active !== false && s.qty <= s.min).sort((a, b) => a.qty - b.qty);
}
function emptyStore(){
  if (!isAdmin()) return `<div class="card empty">The store has no products yet. The Super Admin needs to add the catalogue and opening stock first.</div>`;
  const p = U.seed;
  return `<div class="card stack" style="max-width:720px">

    <p class="muted" style="margin:0">Load sample data to explore every module: 24 products with stock in all three branches, about 40 days of bills, customers with consent records, WhatsApp templates, leads and an AI chat transcript. Everything is marked as sample data and can be cleared from Settings before you go live.</p>
    <p class="muted" style="margin:0">Or start with your own data: add products under <b>Stock &amp; catalogue</b>, then record opening stock for each branch.</p>
    ${p ? `<div class="progress"><div style="width:${Math.round(p.done / p.total * 100)}%"></div></div><div class="muted small">Writing ${p.done} of ${p.total} records…</div>`
        : `<div class="row"><button class="btn primary" data-act="loadSample">Load sample data</button><a class="btn" href="#inventory" data-act="nav" data-v="inventory">Start with my own products</a></div>`}
  </div>`;
}

function findCustomer(phone){ const m = normMobile(phone); if (m.length < 10) return null; return all('customers').find(c => normMobile(c.mobile) === m) || null; }
function purchaseCount(c){ return all('invoices').filter(i => i.customerId === c.id && i.status !== 'cancelled').length; }
function nextSeq(b){ const fy = fyLabel(); return 1 + Math.max(0, ...all('invoices').filter(i => i.branch === b && i.no.includes('/' + fy + '/')).map(i => i.seq || 0)); }
function nextInvoiceNo(b){ return `${S.settings.branches[b]?.prefix || b}/${fyLabel()}/${String(nextSeq(b)).padStart(4,'0')}`; }
function posAdd(pid){
  const P = U.pos; const p = prod(pid); if (!p) return;
  const st = stockOf(P.branch, pid).qty; const c = P.cart.find(x => x.productId === pid);
  if ((c ? c.qty : 0) + 1 > st){ toast(`Only ${st} of this item in stock at ${bname(P.branch)}.`); return; }
  if (c) c.qty++; else P.cart.push({productId: p.id, sku: p.sku, name: `${p.name} · ${p.colour} · ${p.size}`, qty: 1, price: p.price, disc: 0, gst: p.gst, cost: p.cost});

}
async function posComplete(){
  const P = U.pos; const b = P.branch;
  const items = P.cart.map(c => lineCalc(Object.assign({}, c, {qty: Math.max(1, Math.floor(Number(c.qty) || 1)), disc: Math.max(0, Number(c.disc) || 0)})));
  const tot = sumInvoice(items);
  const err = m => { U.f.posErr = m; render(); };
  for (const x of items){
    const st = stockOf(b, x.productId).qty;
    if (x.qty > st) return err(`${x.name}: only ${st} in stock at ${bname(b)}.`);
    if (!isAdmin() && x.disc > S.settings.branchDiscountCap) return err(`Discounts above ${S.settings.branchDiscountCap}% need Super Admin authorization.`);
    if (x.disc > 100) return err('Discount cannot exceed 100%.');
  }
  let payments = P.split ? P.payments.filter(p => Number(p.amount) > 0).map(p => ({mode: p.mode, amount: round2(Number(p.amount))})) : [{mode: P.mode, amount: tot.total}];
  const ps = payments.reduce((a, p) => a + p.amount, 0);
  if (Math.abs(ps - tot.total) > .009) return err(`Payments add up to ${inr2(ps)} but the bill is ${inr2(tot.total)}.`);
  let cust = null;
  if (!P.walkin){
    if (!validMobile(P.phone)) return err('Enter a valid 10-digit mobile number, or tick Walk-in.');
    cust = findCustomer(P.phone);
    if (!cust && !P.name.trim()) return err('Enter the customer’s name.');
    if (!cust && P.saveCust){
      cust = {id: nid('c'), name: P.name.trim(), mobile: normMobile(P.phone), email: '', birthday: '', anniversary: '', branch: b, optIn: !!P.consent,
        consentSource: P.consent ? 'Billing counter' : '', consentDate: P.consent ? todayKey() : '', createdAt: nowISO(), source: 'Billing'};
      put('customers', cust.id, cust);
    }
  }
  if (payments.some(p => p.mode === 'Credit') && !cust) return err('Credit (on account) needs a saved customer. Record the customer and tick “Save as a new customer”.');
  const seq = nextSeq(b);
  const no = `${S.settings.branches[b]?.prefix || b}/${fyLabel()}/${String(seq).padStart(4,'0')}`;
  const inv = Object.assign({no, seq, branch: b, date: nowISO(), customerId: cust ? cust.id : null, customerName: cust ? cust.name : (P.walkin ? 'Walk-in customer' : P.name.trim()),
    customerPhone: cust ? cust.mobile : (P.walkin ? '' : normMobile(P.phone)), items, payments, status: 'completed', user: S.me.name, returns: []}, tot);
  const id = nid('i');
  put('invoices', id, inv);
  items.forEach(x => { const s = stockOf(b, x.productId); put('stock', s.id, Object.assign({}, s, {qty: s.qty - x.qty})); });
  put('movements', nid('m'), {date: inv.date, branch: b, type: 'sale', ref: no, user: S.me.name, reason: 'Sales invoice', lines: items.map(x => ({productId: x.productId, qty: -x.qty}))});
  audit('Invoice created', `${no} · ${inr2(tot.total)}`, b);
  U.pos = Object.assign(U.pos, {cart: [], phone: '', name: '', walkin: true, saveCust: false, consent: false, split: false, payments: [], q: ''});
  U.f.posErr = '';
  U.modal = {type: 'invoice', id};
  toast(`Bill ${no} completed. Stock updated.`);
  render();
}

function doReturn(){
  const m = U.modal; const inv = structuredClone(get('invoices', m.id));

function saveProduct(){
  const m = U.modal; const f = m.f;
  if (!f.name || !f.sku || !(Number(f.price) > 0)){ m.err = 'Name, SKU and a selling price are required.'; return render(); }
  if (all('products').some(p => p.sku === f.sku && p.id !== m.id)){ m.err = 'Another product already uses this SKU.'; return render(); }
  const id = m.id || nid('p');
  const rec = {sku: f.sku.trim(), barcode: (f.barcode || '').trim(), name: f.name.trim(), category: f.category || 'Uncategorised', brand: f.brand || '', size: f.size || '', colour: f.colour || '',
    cost: Number(f.cost) || 0, price: Number(f.price), gst: Number(f.gst ?? 5), active: !(f.active === false || f.active === 'false')};
  put('products', id, rec);
  if (!m.id){
    const lines = [];
    BR.forEach(b => { const q = Math.max(0, Math.floor(Number(f['op_' + b]) || 0)); put('stock', b + '__' + id, {branch: b, productId: id, qty: q, damaged: 0, min: 5}); if (q) lines.push([b, q]); });
    lines.forEach(([b, q]) => put('movements', nid('m'), {date: nowISO(), branch: b, type: 'opening', ref: 'OPENING', user: S.me.name, reason: 'Opening stock', lines: [{productId: id, qty: q}]}));
  }
  audit(m.id ? 'Product updated' : 'Product added', `${rec.sku} · ${rec.name}`, 'ALL');
  U.modal = null; toast('Product saved.'); render();
}

    <div><button class="btn sm" data-act="adjAdd">Add line</button></div>
    <div class="form">
      ${f.type === 'purchase' ? `<label class="f"><span>Supplier</span><input id="adj-sup" type="text" data-bind="f.adj.supplier" value="${esc(f.supplier || '')}"></label><label class="f"><span>Supplier bill no.</span><input id="adj-ref" type="text" data-bind="f.adj.ref" value="${esc(f.ref || '')}"></label>
        <label class="f"><span>Bill amount (₹)</span><input id="adj-amt" type="number" data-bind="f.adj.amount" value="${esc(f.amount || '')}"></label><label class="f"><span>Payment</span><select id="adj-pay" data-bind="f.adj.payMode">${['Payable','Cash','UPI','Bank transfer'].map(x => `<option ${f.payMode === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>` : ''}
      <label class="f wide"><span>Reason / note ${f.type === 'adjustment' ? '(required)' : ''}</span><input id="adj-reason" type="text" data-bind="f.adj.reason" value="${esc(f.reason || '')}"></label>
    </div>
    ${U.f.adjErr ? `<div class="pill bad">${esc(U.f.adjErr)}</div>` : ''}
    <div><button class="btn primary" data-act="doAdjust">Record movement</button></div>
  </div>
  <div class="card stack"><h2>How stock changes</h2><p class="muted" style="margin:0">Nobody can type over a stock balance. Every change is a movement with a type, reference, reason, user and time, so balances always reconcile to the stock ledger.</p>
  <ul class="muted" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><li>Sales and returns post automatically from billing.</li><li>Transfers post on dispatch and on receipt.</li><li>Physical counts post a variance only after Super Admin approval.</li><li>Purchases with a bill amount also post to Accounting, as paid or payable.</li></ul></div></div>`;
}
function doAdjust(){
  const f = U.f.adj; const b = activeBranch() === 'ALL' ? (U.f.adjB || 'B1') : activeBranch();
  const lines = f.lines.filter(l => l.pid && Number(l.qty)).map(l => ({productId: l.pid, qty: Math.floor(Number(l.qty))}));
  const err = m => { U.f.adjErr = m; render(); };
  if (!lines.length) return err('Choose at least one product and quantity.');
  if (f.type === 'adjustment' && !(f.reason || '').trim()) return err('Adjustments need a reason.');
  if (f.type !== 'adjustment' && lines.some(l => l.qty < 0)) return err('Use positive quantities. The movement type sets the direction.');
  for (const l of lines){ const s = stockOf(b, l.productId); const delta = f.type === 'purchase' ? l.qty : f.type === 'adjustment' ? l.qty : -l.qty; if (s.qty + delta < 0) return err(`${pname(l.productId)}: only ${s.qty} available.`); }
  const ref = f.type === 'purchase' ? (f.ref || 'GRN') : f.type.toUpperCase() + '-' + Date.now().toString(36).toUpperCase().slice(-5);
  const signed = lines.map(l => ({productId: l.productId, qty: f.type === 'purchase' || f.type === 'adjustment' ? l.qty : -l.qty}));
  signed.forEach(l => { const s = stockOf(b, l.productId); put('stock', s.id, Object.assign({}, s, {qty: s.qty + l.qty, damaged: (s.damaged || 0) + (f.type === 'damage' ? -l.qty : 0)})); });
  put('movements', nid('m'), {date: nowISO(), branch: b, type: f.type, ref, user: S.me.name, reason: f.reason || (f.type === 'purchase' ? 'Goods receipt' + (f.supplier ? ' from ' + f.supplier : '') : ''), lines: signed});
  if (f.type === 'purchase' && Number(f.amount) > 0) put('ledger', nid('l'), {date: nowISO(), branch: b, kind: 'purchase', category: 'Stock purchase', amount: Number(f.amount), mode: f.payMode, supplier: f.supplier || '', ref: f.ref || '', note: '', user: S.me.name, status: f.payMode === 'Payable' ? 'payable' : 'paid'});
  audit('Stock ' + f.type, `${ref} · ${lines.length} lines`, b);
  U.f.adj = null; U.f.adjErr = ''; toast('Movement recorded.'); render();
}

    <div class="card"><h2>Counts</h2>${table([{label:'Date', html: r => fmtDT(r.date)}, {label:'Branch', html: r => esc(bname(r.branch))}, {label:'Counted by', k:'user'}, {label:'Items', num:true, html: r => r.items.length},
      {label:'Variance items', num:true, html: r => r.items.filter(i => i.counted !== i.system).length}, {label:'Status', html: r => pill(r.status, r.status === 'Approved' ? 'good' : r.status === 'Rejected' ? 'bad' : 'warn')},
      {label:'', html: r => isAdmin() && r.status === 'Pending approval' ? `<button class="btn sm primary" data-act="approveCount" data-id="${r.id}">Approve</button> <button class="btn sm" data-act="rejectCount" data-id="${r.id}">Reject</button>` : ''}], counts, {empty: 'No stock counts yet.'})}</div></div>`;
}
function submitCount(){
  const cur = U.f.count;
  const items = Object.entries(cur.c).filter(([, v]) => v !== '' && v != null).map(([pid, v]) => ({productId: pid, system: stockOf(cur.branch, pid).qty, counted: Math.max(0, Math.floor(Number(v)))}));
  if (!items.length) return toast('Enter at least one counted quantity.');
  put('counts', nid('cnt'), {date: nowISO(), branch: cur.branch, user: S.me.name, items, status: 'Pending approval'});
  audit('Stock count submitted', `${items.length} items`, cur.branch);
  U.f.count = null; toast('Count sent for approval.'); render();
}
function decideCount(id, ok){
  const c = structuredClone(get('counts', id)); delete c.id;
  c.status = ok ? 'Approved' : 'Rejected'; c.decidedBy = S.me.name; c.decidedAt = nowISO();
  if (ok){
    const lines = [];
    c.items.forEach(i => { const s = stockOf(c.branch, i.productId); const d = i.counted - s.qty; if (d){ lines.push({productId: i.productId, qty: d}); put('stock', s.id, Object.assign({}, s, {qty: i.counted})); } });
    if (lines.length) put('movements', nid('m'), {date: nowISO(), branch: c.branch, type: 'count-variance', ref: 'COUNT-' + id.slice(-5).toUpperCase(), user: S.me.name, reason: 'Approved physical count variance', lines});
  }
  put('counts', id, c); audit(ok ? 'Stock count approved' : 'Stock count rejected', '', c.branch); render();
}

const TR_TONE = {Draft:'', Requested:'warn', Approved:'info', Rejected:'bad', Dispatched:'acc', 'Partially Received':'bad', Received:'good'};

    {label:'Next step', html: r => nextStep(r)},
  ], rows, {act: 'openTransfer', empty: 'No transfers yet. Create one to move stock between branches.'})}</div>`;

function nextStep(t){
  return ({Draft: 'Submit request', Requested: 'Super Admin approval', Approved: `${bname(t.from)} to dispatch`, Dispatched: `${bname(t.to)} to receive`, 'Partially Received': t.resolved ? 'Closed' : 'Review discrepancy', Received: 'Closed', Rejected: 'Closed'})[t.status] || '';
}
MODALS.newTransfer = m => {

  return {title: 'New stock transfer', body: `<div class="form">

    <label class="f"><span>To branch</span><select id="nt-to" data-bind="modal.to">${BR.map(b => `<option value="${b}" ${m.to === b ? 'selected' : ''}>${esc(bname(b))}</option>`).join('')}</select></label>

function saveTransfer(status){
  const m = U.modal;
  const items = m.lines.filter(l => l.pid && Number(l.qty) > 0).map(l => ({productId: l.pid, qty: Math.floor(Number(l.qty)), dispatched: 0, received: 0, damaged: 0}));
  if (m.from === m.to){ m.err = 'Choose two different branches.'; return render(); }
  if (!isAdmin() && m.from !== S.me.branch && m.to !== S.me.branch){ m.err = 'One side of the transfer must be your branch.'; return render(); }
  if (!items.length){ m.err = 'Add at least one product with a quantity.'; return render(); }
  const no = 'TR-' + String(1 + Math.max(0, ...all('transfers').map(t => parseInt(t.no.slice(3)) || 0))).padStart(4, '0');
  const id = nid('t');
  put('transfers', id, {no, from: m.from, to: m.to, status, note: m.note || '', items, history: [{status, date: nowISO(), user: S.me.name, note: ''}], createdAt: nowISO()});
  audit('Transfer ' + status.toLowerCase(), `${no} · ${bname(m.from)} → ${bname(m.to)}`, m.from);
  U.modal = {type: 'transfer', id}; render();
}
MODALS.transfer = m => {
  const t = get('transfers', m.id); if (!t) return null;
  m.q = m.q || {};
  const mine = b => isAdmin() || S.me.branch === b;
  let action = '';
  if (t.status === 'Draft' && (mine(t.from) || mine(t.to))) action = `<button class="btn primary" data-act="trStep" data-v="Requested">Submit request</button>`;
  if (t.status === 'Requested' && isAdmin()) action = `<input id="tr-note" type="text" data-bind="modal.note" placeholder="Note (optional)" style="max-width:260px"><button class="btn primary" data-act="trStep" data-v="Approved">Approve</button><button class="btn danger" data-act="trStep" data-v="Rejected">Reject</button>`;
  if (t.status === 'Approved' && mine(t.from)) action = `<button class="btn primary" data-act="trStep" data-v="Dispatched">Confirm dispatch</button>`;
  if (t.status === 'Dispatched' && mine(t.to)) action = `<button class="btn primary" data-act="trStep" data-v="Receive">Confirm receipt</button>`;
  if (t.status === 'Partially Received' && !t.resolved && isAdmin()) action = `<input id="tr-note" type="text" data-bind="modal.note" placeholder="Review outcome, e.g. courier claim raised" style="max-width:320px"><button class="btn primary" data-act="trStep" data-v="Resolve">Mark discrepancy reviewed</button>`;
  const editQ = t.status === 'Approved' && mine(t.from) ? 'dispatch' : t.status === 'Dispatched' && mine(t.to) ? 'receive' : '';
  return {title: `Transfer <span class="mono">${esc(t.no)}</span> ${pill(t.status, TR_TONE[t.status])}`, wide: true, body: `
    <div class="muted">${esc(bname(t.from))} → ${esc(bname(t.to))}${t.note ? ' · ' + esc(t.note) : ''}</div>
    <div class="tw"><table><thead><tr><th>Product</th><th class="num">Requested</th><th class="num">Dispatched</th><th class="num">Received</th><th class="num">Damaged</th><th class="num">Shortage</th></tr></thead><tbody>
    ${t.items.map((i, k) => `<tr><td>${esc(pname(i.productId))}${editQ === 'dispatch' ? `<div class="muted small">${stockOf(t.from, i.productId).qty} available at source</div>` : ''}</td><td class="num">${i.qty}</td>
      <td class="num">${editQ === 'dispatch' ? `<input id="tq-d-${k}" type="number" min="0" data-bind="modal.q.d${k}" value="${esc(m.q['d' + k] ?? i.qty)}" style="width:70px">` : i.dispatched}</td>
      <td class="num">${editQ === 'receive' ? `<input id="tq-r-${k}" type="number" min="0" data-bind="modal.q.r${k}" value="${esc(m.q['r' + k] ?? i.dispatched)}" style="width:70px">` : i.received}</td>
      <td class="num">${editQ === 'receive' ? `<input id="tq-x-${k}" type="number" min="0" data-bind="modal.q.x${k}" value="${esc(m.q['x' + k] ?? 0)}" style="width:70px">` : i.damaged}</td>
      <td class="num">${['Received','Partially Received'].includes(t.status) ? Math.max(0, i.dispatched - i.received - i.damaged) : '–'}</td></tr>`).join('')}
    </tbody></table></div>
    ${m.err ? `<div class="pill bad">${esc(m.err)}</div>` : ''}
    ${action ? `<div class="row">${action}</div>` : `<div class="muted small">No action for you at this step. ${esc(nextStep(t))}.</div>`}
    <h3>History</h3><div class="stack" style="gap:6px">${t.history.map(h => `<div class="small">${pill(h.status, TR_TONE[h.status] || '')} ${fmtDT(h.date)} · ${esc(h.user)}${h.note ? ' · ' + esc(h.note) : ''}</div>`).join('')}</div>`};
};
function trStep(step){
  const m = U.modal; const t = structuredClone(get('transfers', m.id)); const id = t.id; delete t.id;
  const hist = (status, note = '') => t.history.push({status, date: nowISO(), user: S.me.name, note});
  if (step === 'Requested' || step === 'Approved' || step === 'Rejected'){ t.status = step; hist(step, m.note || ''); }
  if (step === 'Dispatched'){
    for (let k = 0; k < t.items.length; k++){ const i = t.items[k]; const d = Math.floor(Number(m.q['d' + k] ?? i.qty)); if (d < 0 || d > i.qty){ m.err = 'Dispatch quantity must be between 0 and the requested quantity.'; return render(); } if (d > stockOf(t.from, i.productId).qty){ m.err = `Not enough stock at ${bname(t.from)} for ${pname(i.productId)}.`; return render(); } i.dispatched = d; }
    t.items.forEach(i => { const s = stockOf(t.from, i.productId); put('stock', s.id, Object.assign({}, s, {qty: s.qty - i.dispatched})); });
    put('movements', nid('m'), {date: nowISO(), branch: t.from, type: 'transfer-out', ref: t.no, user: S.me.name, reason: 'Dispatched to ' + bname(t.to), from: t.from, to: t.to, lines: t.items.filter(i => i.dispatched).map(i => ({productId: i.productId, qty: -i.dispatched}))});
    t.status = 'Dispatched'; hist('Dispatched');
  }
  if (step === 'Receive'){
    for (let k = 0; k < t.items.length; k++){ const i = t.items[k]; const r = Math.floor(Number(m.q['r' + k] ?? i.dispatched)); const x = Math.floor(Number(m.q['x' + k] ?? 0)); if (r < 0 || x < 0 || r + x > i.dispatched){ m.err = 'Received plus damaged cannot exceed the dispatched quantity.'; return render(); } i.received = r; i.damaged = x; }
    t.items.forEach(i => { const s = stockOf(t.to, i.productId); put('stock', s.id, Object.assign({}, s, {qty: s.qty + i.received, damaged: (s.damaged || 0) + i.damaged})); });
    put('movements', nid('m'), {date: nowISO(), branch: t.to, type: 'transfer-in', ref: t.no, user: S.me.name, reason: 'Received from ' + bname(t.from), from: t.from, to: t.to, lines: t.items.filter(i => i.received).map(i => ({productId: i.productId, qty: i.received}))});
    const ok = t.items.every(i => i.received === i.dispatched);
    t.status = ok ? 'Received' : 'Partially Received'; t.discrepancy = !ok; hist(t.status, ok ? '' : 'Shortage or damage recorded — sent for review');
  }
  if (step === 'Resolve'){ t.resolved = true; hist('Partially Received', 'Reviewed: ' + (m.note || 'closed')); }
  put('transfers', id, t);
  audit('Transfer ' + (step === 'Receive' ? t.status.toLowerCase() : step.toLowerCase()), t.no, step === 'Receive' ? t.to : t.from);
  U.modal = {type: 'transfer', id}; render();
}

function accTotals(){
  const invs = all('invoices').filter(i => inScope(i) && inRange(i.date) && i.status !== 'cancelled');
  const L = all('ledger').filter(l => inScope(l) && inRange(l.date));
  const sales = invs.reduce((a, i) => a + i.total, 0);
  const rets = all('invoices').filter(i => inScope(i)).reduce((a, i) => a + (i.returns || []).filter(r => inRange(r.date)).reduce((s, r) => s + r.amount, 0), 0);
  const disc = invs.reduce((a, i) => a + i.discount, 0);
  const tax = invs.reduce((a, i) => a + i.tax, 0);
  const exp = L.filter(l => l.kind === 'expense').reduce((a, l) => a + l.amount, 0);
  const inc = L.filter(l => l.kind === 'income').reduce((a, l) => a + l.amount, 0);
  const pur = L.filter(l => l.kind === 'purchase').reduce((a, l) => a + l.amount, 0);
  const modes = {}; invs.forEach(i => i.payments.forEach(p => modes[p.mode] = (modes[p.mode] || 0) + p.amount));
  return {sales, rets, disc, tax, exp, inc, pur, modes, count: invs.length};
}

function dayFigures(b, day){
  const s = new Date(day + 'T00:00').getTime(), e = s + DAY;
  const inD = iso => { const t = new Date(iso).getTime(); return t >= s && t < e; };
  const modes = {}; let refundsCash = 0;
  all('invoices').filter(i => i.branch === b).forEach(i => { if (i.status !== 'cancelled' && inD(i.date)) i.payments.forEach(p => modes[p.mode] = (modes[p.mode] || 0) + p.amount); (i.returns || []).forEach(r => { if (inD(r.date) && r.refundMode === 'Cash') refundsCash += r.amount; }); });
  const L = all('ledger').filter(l => l.branch === b && inD(l.date) && l.status !== 'payable' && l.mode === 'Cash');
  const cashIn = L.filter(l => l.kind === 'income' || l.kind === 'receipt').reduce((a, l) => a + l.amount, 0);
  const cashOut = L.filter(l => l.kind === 'expense' || l.kind === 'purchase').reduce((a, l) => a + l.amount, 0);
  return {modes, refundsCash, cashIn, cashOut, expected: round2((modes.Cash || 0) - refundsCash + cashIn - cashOut)};
}

function accGst(){

  const rows = Object.entries(by).map(([r, v]) => ({id: r, r, t: v.t, cg: v.x / 2, sg: v.x / 2, tot: v.t + v.x}));

function custIndex(){
  const idx = {};
  all('invoices').forEach(i => { if (!i.customerId || i.status === 'cancelled') return; const r = idx[i.customerId] = idx[i.customerId] || {count: 0, spent: 0, last: '', branches: new Set()}; r.count++; r.spent += netOf(i); if (i.date > r.last) r.last = i.date; r.branches.add(i.branch); });
  return idx;
}
function custInScope(c, idx){
  if (isAdmin()) return U.branch === 'ALL' || c.branch === U.branch;
  return c.branch === S.me.branch || idx[c.id]?.branches.has(S.me.branch);
}
const SEGMENTS = {all:'All customers', birthday:'Birthday this month', anniversary:'Anniversary this month', recent:'Bought in last 90 days', lapsed:'No purchase in 90+ days', repeat:'Repeat buyers (2+ bills)', optin:'WhatsApp opted in', optout:'Not opted in'};
function segMatch(c, seg, idx){
  const mo = new Date().getMonth(); const st = idx[c.id];
  switch (seg){
    case 'birthday': return c.birthday && new Date(c.birthday).getMonth() === mo;
    case 'anniversary': return c.anniversary && new Date(c.anniversary).getMonth() === mo;
    case 'recent': return st && Date.now() - new Date(st.last).getTime() <= 90 * DAY;
    case 'lapsed': return !st || Date.now() - new Date(st.last).getTime() > 90 * DAY;
    case 'repeat': return st && st.count >= 2;
    case 'optin': return c.optIn;
    case 'optout': return !c.optIn;
  }
  return true;
}

/* import */
function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"' && text[i + 1] === '"'){ cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += ch;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function toISODate(v){
  v = (v || '').trim(); if (!v) return '';
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/); if (m){ const y = m[3].length === 2 ? '19' + m[3] : m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return 'invalid';
}
function analyseImport(text){
  const rows = parseCSV(text); if (rows.length < 2) return {error: 'The file needs a header row and at least one customer.'};
  const head = rows[0].map(h => h.trim().toLowerCase());
  const find = re => head.findIndex(h => re.test(h));
  const map = {name: find(/name/), mobile: find(/mobile|phone|contact|whatsapp/), email: find(/mail/), birthday: find(/birth|dob/), anniversary: find(/anniv/), branch: find(/branch|store/), optIn: find(/opt|consent/)};
  if (map.name < 0 || map.mobile < 0) return {error: 'Could not find a Name column and a Mobile column in the header row.'};
  const existing = new Map(all('customers').map(c => [normMobile(c.mobile), c]));
  const seen = new Set(); const out = [];
  rows.slice(1).forEach((r, i) => {
    const g = k => map[k] >= 0 ? (r[map[k]] || '').trim() : '';
    const rec = {line: i + 2, name: g('name'), mobile: normMobile(g('mobile')), rawMobile: g('mobile'), email: g('email'), birthday: toISODate(g('birthday')), anniversary: toISODate(g('anniversary')),
      branch: (() => { const b = g('branch').toUpperCase(); const hit = BR.find(x => b.includes(x.slice(1)) || b === x || b.includes(bname(x).toUpperCase())); return hit || 'B1'; })(), optIn: /^(y|yes|true|1|opted in|opt-in)$/i.test(g('optIn'))};
    const issues = [];
    if (!rec.name) issues.push('Missing name');
    if (!validMobile(rec.rawMobile)) issues.push('Invalid mobile');
    if (rec.birthday === 'invalid') { issues.push('Unreadable birthday'); rec.birthday = ''; }
    if (rec.anniversary === 'invalid') { issues.push('Unreadable anniversary'); rec.anniversary = ''; }
    let status = 'New';
    if (issues.some(x => /name|mobile/i.test(x))) status = 'Invalid';
    else if (existing.has(rec.mobile)) status = 'Duplicate (already in database)';
    else if (seen.has(rec.mobile)) status = 'Duplicate (repeated in file)';
    if (status === 'New') seen.add(rec.mobile);
    out.push(Object.assign(rec, {issues, status}));
  });
  return {rows: out, map};
}

  return `<div class="grid g2"><div class="card stack"><h2>1. Choose a file</h2>

function kbFallback(q){
  const lines = S.kb.split('\n').map(s => s.trim()).filter(Boolean);
  const words = q.toLowerCase().match(/[a-z]{3,}/g) || [];
  const stop = new Set(['the','you','your','what','are','have','for','and','can','with','does','any','how','when','where','there','this','that','store','shop']);
  const syn = {timing:'hours', timings:'hours', open:'hours', close:'hours', exchange:'exchange', return:'exchange', refund:'exchange', alter:'alterations', alteration:'alterations', pay:'payment', upi:'payment', card:'payment', shirt:'shirts', suit:'suits', sherwani:'sherwanis', kurta:'kurtas', price:'prices', stock:'stock', available:'stock', discount:'offers', offer:'offers', contact:'contact', call:'contact'};
  let best = null, score = 0;
  lines.forEach(l => { const L = l.toLowerCase(); let s = 0; words.filter(w => !stop.has(w)).forEach(w => { if (L.includes(w)) s += 2; else if (syn[w] && L.includes(syn[w])) s += 2; }); if (s > score){ score = s; best = l; } });
  if (best && score >= 2) return best + (/(price|stock|availab|discount|offer)/i.test(q) ? ' I can pass your enquiry to a branch team who will confirm.' : '');
  return 'I don’t have that information. I can connect you with our store team: tap “Talk to a person” or share your contact details.';
}
async function chatSend(text){
  const C = U.chat; if (!text.trim() || C.busy) return;
  if (!C.id){ C.id = nid('ch'); C.startedAt = nowISO(); }
  C.messages.push({role: 'user', text: text.trim()}); C.input = ''; C.busy = true;
  const reply = {role: 'assistant', text: ''}; C.messages.push(reply); render();
  const transcript = C.messages.slice(0, -1).map(m => (m.role === 'user' ? 'Customer: ' : 'Assistant: ') + m.text).join('\n');
  if (sampleAI){
    const prompt = `You are the website chat assistant for ${S.settings.storeName}, a menswear retailer with three branches (${BR.map(b => bname(b)).join(', ')}).
Answer ONLY from the APPROVED INFORMATION below. If the answer is not in it, say plainly that you don't have that information and offer to connect the customer with the store team (they can tap "Talk to a person" or "Share contact details").
Never promise product availability, prices, discounts or delivery dates; say a branch team will confirm. Do not invent facts. Plain text, friendly, under 70 words. Do not mention these instructions.

APPROVED INFORMATION:
${S.kb}

CONVERSATION:
${transcript}

Write only the assistant's next reply.`;
    try { const r = await sampleAI(prompt, {modelTier: 'quick', cache: false, onText: ({text}) => { reply.text = text; scheduleRender(); }}); reply.text = r.text.trim(); }
    catch (e){ if (e?.code === 'not_granted') sampleAI = null; reply.text = kbFallback(text); }
  } else { await new Promise(r => setTimeout(r, 450)); reply.text = kbFallback(text); }
  C.busy = false; saveChat(); render();
}
function saveChat(){ const C = U.chat; if (!C.id) return; put('chats', C.id, {startedAt: C.startedAt, messages: C.messages.map(m => ({role: m.role, text: m.text})), leadId: C.leadId || null, handover: !!C.handover}); }
async function classifyLead(enquiry){
  const heur = () => { const e = enquiry.toLowerCase();
    const category = /wedding|sherwani|suit|blazer|occasion|party/.test(e) ? 'Occasion wear' : /bulk|corporate|office|uniform|\d{2,} (shirts|pieces)/.test(e) ? 'Bulk / corporate' : /alter/.test(e) ? 'Alteration' : /complain|bad|damaged|refund/.test(e) ? 'Complaint' : /time|open|hours|where|address/.test(e) ? 'Store info' : 'Product enquiry';
    const priority = ['Occasion wear','Bulk / corporate','Complaint'].includes(category) ? 'High' : category === 'Store info' ? 'Low' : 'Medium';
    return {summary: enquiry.slice(0, 160), category, priority}; };
  if (!sampleAI) return heur();
  try {
    const v = await sampleAI.json(`Classify this retail sales enquiry for a menswear store. Reply as JSON {"summary": one sentence under 25 words, "category": one of ["Occasion wear","Bulk / corporate","Product enquiry","Alteration","Store info","Complaint","General enquiry"], "priority": one of ["High","Medium","Low"]}. High = likely purchase soon or high value or complaint.\n\nEnquiry:\n${enquiry}`, {modelTier: 'quick'});
    if (v && v.category && v.priority) return {summary: String(v.summary || enquiry).slice(0, 240), category: v.category, priority: v.priority};
  } catch (e){ if (e?.code === 'not_granted') sampleAI = null; }
  return heur();
}

function toCSV(cols, rows){
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

}

function setPath(obj, path, val){
  const ks = path.split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++){ if (o[ks[i]] == null) o[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = val;
}
function onBind(el, live){
  const path = el.dataset.bind; const val = el.type === 'checkbox' ? el.checked : el.value;
  setPath(U, path, val);
  if (path === 'pos.split' && val && !U.pos.payments.length){ const t = sumInvoice(U.pos.cart.map(lineCalc)).total; U.pos.payments = [{mode: 'Cash', amount: ''}, {mode: 'UPI', amount: t ? String(t) : ''}]; }
  if (path === 'pos.branch'){ U.pos.cart = []; }
  if (path === 'f.pin') U.f.loginErr = '';
  if (path.startsWith('modal.') && U.modal) U.modal.err = '';
  if (live) scheduleRender(); else render();
}
const LIVE_TYPES = new Set(['text', 'search', 'tel', 'password', 'textarea']);
document.addEventListener('input', e => {

    const jobs = []; COLS.forEach(c => S.data[c].forEach((_, id) => jobs.push([c, id])));
    U.clear = {done: 0, total: jobs.length || 1}; render();
    for (let i = 0; i < jobs.length; i += 10){ await Promise.all(jobs.slice(i, i + 10).map(([c, id]) => del(c, id))); U.clear.done = i + 10; scheduleRender(); }
    U.clear = null; U.f.clr = ''; S.empty = true; audit('All business data cleared', `${jobs.length} records`, 'ALL'); toast('All business data cleared.'); render();
  },
  /* POS */
  posCat(el){ U.pos.cat = el.dataset.v; render(); },
  posAdd(el){ posAdd(el.dataset.id); },
  posClear(){ U.pos.cart = []; U.f.posErr = ''; render(); },
  posDel(el){ U.pos.cart.splice(Number(el.dataset.i), 1); render(); },
  posMode(el){ U.pos.mode = el.dataset.v; U.f.posErr = ''; render(); },
  payAdd(){ U.pos.payments.push({mode: 'Card', amount: ''}); render(); },
  payDel(el){ U.pos.payments.splice(Number(el.dataset.i), 1); render(); },
  posComplete(){ const a = document.activeElement; if (a && a.dataset?.bind) setPath(U, a.dataset.bind, a.type === 'checkbox' ? a.checked : a.value); posComplete(); },
  /* invoices */
  openInvoice(el){ U.modal = {type: 'invoice', id: el.dataset.id}; render(); },
  invMode(el){ U.modal.mode = el.dataset.v; U.modal.err = ''; if (el.dataset.v === 'return'){ U.modal.ret = {}; U.modal.reason = 'Size exchange'; U.modal.refund = 'Cash'; } render(); },
  doReturn(){ syncActive(); doReturn(); },
  doCancel(){ syncActive(); doCancel(); },
  dlReceipt(el){ const inv = get('invoices', el.dataset.id); const css = 'body{font-family:monospace;background:#f4f4f4;padding:20px}.receipt{background:#fff;max-width:380px;margin:auto;padding:16px;border:1px dashed #aaa;font-size:12.5px}.c{text-align:center}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:3px 2px}hr{border:0;border-top:1px dashed #999}';
    saveFile(inv.no.replace(/\//g, '-') + '.html', `<!doctype html><html><head><meta charset="utf-8"><title>${esc(inv.no)}</title><style>${css}</style></head><body>${receiptHTML(inv)}</body></html>`, 'text/html'); },
  /* inventory */
  openStock(el){ U.modal = {type: 'stock', id: el.dataset.id}; render(); },
  saveMin(el){ syncActive(); const b = el.dataset.b; const v = Math.max(0, Math.floor(Number(U.modal.min[b]))); if (isNaN(v)) return; const s = stockOf(b, U.modal.id); put('stock', s.id, Object.assign({}, s, {min: v})); audit('Minimum level set', `${prod(U.modal.id)?.sku} → ${v}`, b); toast('Minimum level saved.'); },
  editProduct(el){ if (!isAdmin()) return; const id = el.dataset.id; const p = id ? get('products', id) : null; U.modal = {type: 'product', id: id || null, f: p ? structuredClone(p) : {gst: 5, active: true}}; render(); },
  saveProduct(){ syncActive(); saveProduct(); },

  adjDel(el){ U.f.adj.lines.splice(Number(el.dataset.i), 1); if (!U.f.adj.lines.length) U.f.adj.lines.push({pid: '', qty: ''}); render(); },
  doAdjust(){ syncActive(); doAdjust(); },
  startCount(){ U.f.count = {branch: activeBranch(), c: {}}; render(); },
  submitCount(){ syncActive(); submitCount(); },
  cancelCount(){ U.f.count = null; render(); },
  approveCount(el){ decideCount(el.dataset.id, true); toast('Count approved. Variance posted to the stock ledger.'); },

  /* transfers */
  newTransfer(){ const mine = myBranch(); U.modal = {type: 'newTransfer', from: mine ? BR.find(b => b !== mine) : 'B1', to: mine || 'B2', lines: [{pid: '', qty: ''}]}; render(); },
  ntAdd(){ U.modal.lines.push({pid: '', qty: ''}); render(); },

  openTransfer(el){ U.modal = {type: 'transfer', id: el.dataset.id}; render(); },
  trStep(el){ syncActive(); U.modal.err = ''; trStep(el.dataset.v); },
  exportLedger(){ const cols = [['date','Date',{type:'date'}],['branch','Branch'],['type','Type'],['sku','SKU'],['product','Product'],['qty','Qty'],['ref','Reference'],['reason','Reason'],['user','User']]; saveFile(`rsmw-stock-ledger-${todayKey()}.csv`, toCSV(cols, (U.lastLedger || []).map(r => Object.assign({}, r, {date: r.date}))), 'text/csv'); },
  /* accounting */
  newEntry(){ U.modal = {type: 'entry', kind: 'expense', branch: myBranch() || (U.branch === 'ALL' ? 'B1' : U.branch), date: todayKey(), mode: 'Cash'}; render(); },
  saveEntry(){ syncActive(); saveEntry(); },
  saveClosing(el){ syncActive(); const b = el.dataset.b, day = el.dataset.day; if (U.f.clCash === '' || U.f.clCash == null) return toast('Enter the cash counted.'); const F = dayFigures(b, day); const counted = Number(U.f.clCash);
    put('closings', b + '_' + day, {day, branch: b, expected: F.expected, counted, variance: round2(counted - F.expected), modes: F.modes, note: U.f.clNote || '', user: S.me.name, date: nowISO()});
    audit('Day closed', `${day} · variance ${inr2(counted - F.expected)}`, b); U.f.clCash = ''; U.f.clNote = ''; toast('Day-end closing saved.'); render(); },
  recvPay(el){ U.modal = {type: 'receipt', customerId: el.dataset.id, amount: el.dataset.amt, branch: el.dataset.b, mode: 'Cash'}; render(); },
  saveReceipt(){ syncActive(); const m = U.modal; const a = Number(m.amount); if (!(a > 0)){ m.err = 'Enter a positive amount.'; return render(); }
    put('ledger', nid('l'), {date: nowISO(), branch: m.branch, kind: 'receipt', category: 'Customer payment', amount: a, mode: m.mode, customerId: m.customerId, ref: get('customers', m.customerId)?.name || '', note: '', user: S.me.name, status: 'paid'});
    audit('Customer payment received', `${get('customers', m.customerId)?.name} · ${inr2(a)}`, m.branch); U.modal = null; toast('Payment recorded.'); render(); },
  markPaid(el){ const l = Object.assign({}, get('ledger', el.dataset.id)); delete l.id; l.status = 'paid'; l.mode = 'Bank transfer'; l.paidAt = nowISO(); put('ledger', el.dataset.id, l); audit('Supplier bill paid', `${l.supplier} · ${inr2(l.amount)}`, l.branch); toast('Marked as paid.'); },
  /* customers */
  editCustomer(el){ const id = el.dataset.id; const c = id ? get('customers', id) : null; U.modal = {type: 'customer', id: id || null, f: c ? structuredClone(c) : {branch: myBranch() || (U.branch === 'ALL' ? 'B1' : U.branch), optIn: false}}; render(); },
  saveCustomer(){ syncActive(); saveCustomer(); },
  custDelAsk(){ U.modal.confirmDel = true; render(); },
  custDelCancel(){ U.modal.confirmDel = false; render(); },
  delCustomer(){ const m = U.modal; del('customers', m.id); audit('Customer deleted', m.f.name, m.f.branch); U.modal = null; toast('Customer record deleted.'); render(); },
  impFile(el){ const file = el.files && el.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { U.f.impText = String(r.result || ''); U.f.imp = analyseImport(U.f.impText); render(); }; r.readAsText(file); },
  impAnalyse(){ syncActive(); U.f.imp = analyseImport(U.f.impText || ''); render(); },
  impTemplate(){ saveFile('customer-import-template.csv', '﻿Name,Mobile,Email,Birthday,Anniversary,Branch,Opt-in\r\nRavi Kumar,9876543210,ravi@example.com,14/02/1990,,Branch 1,Yes\r\n', 'text/csv'); },
  impConfirm(){ const rows = (U.f.imp?.rows || []).filter(r => r.status === 'New');
    rows.forEach(r => put('customers', nid('c'), {name: r.name, mobile: r.mobile, email: r.email, birthday: r.birthday, anniversary: r.anniversary, branch: r.branch, optIn: r.optIn, consentSource: r.optIn ? 'Imported (pre-existing consent)' : '', consentDate: r.optIn ? todayKey() : '', createdAt: nowISO(), source: 'Import'}));
    audit('Customers imported', `${rows.length} new, ${(U.f.imp.rows.length - rows.length)} skipped`, 'ALL'); U.f.imp = null; U.f.impText = ''; toast(`${rows.length} customers imported.`); render(); },
  impReport(){ const cols = [['line','Line'],['name','Name'],['rawMobile','Mobile'],['email','Email'],['status','Result'],['issues','Issues']]; saveFile('customer-import-report.csv', toCSV(cols, U.f.imp.rows.map(r => Object.assign({}, r, {issues: r.issues.join('; ')}))), 'text/csv'); },
  /* whatsapp */
  newCampaign(){ U.modal = {type: 'campaign', segment: 'optin', branch: myBranch() || U.branch, when: 'now', name: ''}; render(); },
  confirmCampaign(){ syncActive(); confirmCampaign(); },
  openCampaign(el){ U.modal = {type: 'campaignView', id: el.dataset.id}; render(); },
  sendNow(el){ const c = structuredClone(get('campaigns', el.dataset.id)); delete c.id; c.status = 'Sending'; put('campaigns', el.dataset.id, c); simulateSend(el.dataset.id, false); audit('Campaign sent', c.name, c.branch); render(); },
  retryFailed(el){ simulateSend(el.dataset.id, true); audit('Campaign retry', get('campaigns', el.dataset.id)?.name, get('campaigns', el.dataset.id)?.branch); toast('Retrying failed messages.'); },
  editTemplate(el){ const id = el.dataset.id; const t = id ? get('templates', id) : null; U.modal = {type: 'template', id: id || null, f: t ? structuredClone(t) : {category: 'Greeting', status: 'Pending approval', body: 'Hi {{name}}, '}}; render(); },
  saveTemplate(){ syncActive(); const m = U.modal; if (!m.f.name || !m.f.body) return toast('Name and message are required.'); const id = m.id || nid('tpl'); const r = structuredClone(m.f); delete r.id; put('templates', id, r); audit('Template saved', `${r.name} · ${r.status}`, 'ALL'); U.modal = null; render(); },
  /* AI */
  chatOpen(){ U.chat.open = true; render(); setTimeout(() => document.getElementById('chat-in')?.focus(), 0); },
  chatClose(){ U.chat.open = false; render(); },
  chatForm(){ U.chat.form = true; U.chat.handover = false; U.chat.err = ''; render(); },
  chatHandover(){ const C = U.chat; C.handover = true; C.form = true; C.messages.push({role: 'assistant', text: 'Sure. Share your name, number and preferred branch, and I’ll pass this conversation to the store team.'}); render(); },
  chatFormClose(){ U.chat.form = false; render(); },
  chatLead(){ syncActive(); chatLead(); },
  saveKb(){ putConfig('kb', {text: U.f.kb}); audit('Knowledge base updated', '', 'ALL'); toast('Knowledge base saved.'); },
  resetKbDraft(){ U.f.kb = S.kb; render(); },
  openChat(el){ U.modal = {type: 'chatView', id: el.dataset.id}; render(); },
  /* leads */
  newLead(){ U.modal = {type: 'lead', id: null, f: {source: 'Walk-in', branch: myBranch() || (U.branch === 'ALL' ? 'B1' : U.branch), stage: 'New', priority: 'Medium', category: 'Product enquiry', consent: true, followUp: todayKey()}}; render(); },
  openLead(el){ const l = get('leads', el.dataset.id); U.modal = {type: 'lead', id: l.id, f: structuredClone(l)}; render(); },
  saveLead(){ syncActive(); saveLead(); },
  async aiLead(){ syncActive(); const m = U.modal; m.aiBusy = true; render(); const ai = await classifyLead(m.f.enquiry || m.f.name); if (U.modal !== m) return; Object.assign(m.f, {aiPriority: ai.priority, aiSummary: ai.summary, category: ai.category, priority: ai.priority}); m.aiBusy = false; toast('AI suggestion applied. Review it before saving.'); render(); },
  addNote(){ syncActive(); const m = U.modal; if (!(m.note || '').trim()) return; const l = structuredClone(get('leads', m.id)); delete l.id; l.notes = [...(l.notes || []), {date: nowISO(), user: S.me.name, text: m.note.trim()}]; put('leads', m.id, l); m.note = ''; render(); },
  /* reports */
  repPick(el){ U.f['rep_' + el.dataset.a] = el.dataset.v; render(); },
  exportReport(el){ const def = REPORTS[el.dataset.a].find(r => r[0] === el.dataset.v); const R = def[2](); saveFile(`rsmw-${el.dataset.a}-${def[0]}-${todayKey()}.csv`, toCSV(R.cols, R.rows), 'text/csv'); audit('Report exported', def[1], S.me.branch || 'ALL'); },
  /* settings */
  saveSettings(){ syncActive(); const f = U.f.set;
    const px = BR.map(b => (f.branches[b].prefix || '').trim()); if (px.some(p => !p) || new Set(px).size !== px.length) return toast('Each branch needs its own invoice prefix.');
    if (f.users.some(u => !/^\d{4,8}$/.test(String(u.pin)))) return toast('PINs must be 4 to 8 digits.');
    if (!f.users.some(u => u.role === 'admin' && u.active !== false)) return toast('Keep at least one active Super Admin.');
    f.branchDiscountCap = Number(f.branchDiscountCap) || 0;
    putConfig('settings', structuredClone(f)); audit('Settings updated', '', 'ALL'); U.f.set = null; refreshMe(); toast('Settings saved.'); render(); },
  resetSettings(){ U.f.set = null; render(); },
  toggleUser(el){ const u = U.f.set.users.find(x => x.id === el.dataset.id); if (u) u.active = u.active === false; render(); },
  addUser(){ syncActive(); const n = U.f.newUser; if (!n.name.trim() || !/^\d{4,8}$/.test(n.pin)) return toast('Enter a name and a 4–8 digit PIN.');
    U.f.set.users.push({id: nid('u'), name: n.name.trim(), role: n.role, branch: n.role === 'admin' ? null : n.branch, pin: n.pin, active: true}); U.f.newUser = null; render(); },
};
function syncActive(){ const a = document.activeElement; if (a && a.dataset && a.dataset.bind) setPath(U, a.dataset.bind, a.type === 'checkbox' ? a.checked : a.value); }
function mergeSettings(d){
  const s = structuredClone(DEFAULT_SETTINGS); const x = structuredClone(d || {});
  Object.assign(s, x); s.branches = Object.assign(structuredClone(DEFAULT_SETTINGS.branches), x.branches || {});
  BR.forEach(b => s.branches[b] = Object.assign({}, DEFAULT_SETTINGS.branches[b], s.branches[b]));
  if (!Array.isArray(s.users) || !s.users.length) s.users = structuredClone(DEFAULT_SETTINGS.users);
  return s;
}
function refreshMe(){
  if (!S.me){ try { const id = localStorage.getItem('rsmw.me'); const u = id && S.settings.users.find(x => x.id === id && x.active !== false); if (u){ S.me = u; U.branch = u.role === 'admin' ? 'ALL' : u.branch; U.pos.branch = u.branch || 'B1'; const v = location.hash.slice(1); if (v && allowedView(v)) U.view = v; } } catch {} return; }
  const u = S.settings.users.find(x => x.id === S.me.id);
  if (!u || u.active === false){ S.me = null; toast('Your account was deactivated.'); } else S.me = u;
}

/* ---------- boot ---------- */
function goOffline(){
  S.mode = 'offline';
  const d = buildSample(Date.now()); Object.entries(d).forEach(([c, list]) => { S.data[c] = new Map(list.map(r => [r.id, r])); });
  S.empty = false; refreshMe(); render();
}
function goLive(){
  S.mode = 'live';
  const pending = new Set([...COLS, 'config']);
  const done = c => { if (pending.delete(c) && !pending.size){ clearTimeout(timer); S.stale = false; } };
  const timer = setTimeout(() => { if (pending.size){ S.stale = true; scheduleRender(); } }, 10000);
  COLS.forEach(c => {
    db.collection(c).onSnapshot(snap => {
      const m = new Map(); snap.docs.forEach(d => m.set(d.id, Object.assign({}, d.data(), {id: d.id})));
      S.data[c] = m;
      if (!snap.metadata.fromCache){ done(c); if (c === 'products') S.empty = snap.empty; }
      scheduleRender();
    }, () => { S.stale = true; clearTimeout(timer); scheduleRender(); });
  });
  db.collection('config').onSnapshot(snap => {
    snap.docs.forEach(d => { if (d.id === 'settings') S.settings = mergeSettings(d.data()); if (d.id === 'kb') S.kb = d.data().text || DEFAULT_KB; });
    if (!snap.metadata.fromCache) done('config');
    refreshMe(); scheduleRender();
  }, () => { S.stale = true; scheduleRender(); });
  refreshMe(); render();
}
async function boot(){
  const v = location.hash.slice(1); if (v) U.view = v;
  render();
  let c = window.claude;
  for (let i = 0; i < 15 && !(c && typeof c.use === 'function'); i++){ await new Promise(r => setTimeout(r, 100)); c = window.claude; }
  if (!c || typeof c.use !== 'function'){ goOffline(); return; }
  try { db = await c.use('db'); } catch { db = null; }
  if (db) goLive(); else goOffline();
  c.use('sample').then(x => { sampleAI = x; scheduleRender(); }).catch(() => {});
  c.use('downloads').then(x => { downloads = x; }).catch(() => {});
}
boot();
</script>
